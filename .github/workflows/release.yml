name: RustDesk Hub Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "rustdesk-hub-v*"

permissions:
  contents: write

concurrency:
  group: rustdesk-hub-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run tests
        shell: pwsh
        run: .\tests\Run-Tests.ps1
      - name: Build Windows bundle
        shell: pwsh
        run: .\packaging\Build-WindowsPackage.ps1 -Force
      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem .\dist\rustdesk-hub-windows-*.zip | Select-Object -First 1
          .\packaging\Test-WindowsPackage.ps1 -Package $zip.FullName -RunBundleTests
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustdesk-hub-windows
          path: |
            dist/*.zip
            dist/*.sha256
            THIRD_PARTY.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rustdesk-hub-windows
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --prerelease --title "$GITHUB_REF_NAME" --generate-notes
          fi
